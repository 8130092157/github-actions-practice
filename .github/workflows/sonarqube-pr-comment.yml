name: SonarQube Analysis & PR Comment

on:
  pull_request:

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=8130092157_github-actions-practice
            -Dsonar.organization=8130092157

      - name: Post SonarQube Results to PR
        uses: 8130092157/github-actions-practice@v1
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          sonarqube-token: ${{ secrets.SONAR_TOKEN }}
          sonarqube-host-url: 'https://sonarcloud.io'
          sonarqube-project-key: 'your-project-key'
          sonarqube-organization: 'your-organization'
