name: SonarQube Analysis & PR Comment

on:
  pull_request:

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=8130092157_github-actions-practice
            -Dsonar.organization=8130092157

      - name: Fetch SonarQube Results
        id: sonar
        uses: ./
        if: always()
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          sonarqube-token: ${{ secrets.SONAR_TOKEN }}
          sonarqube-host-url: 'https://sonarcloud.io'
          sonarqube-project-key: '8130092157_github-actions-practice'
          sonarqube-organization: '8130092157'

      - name: Post SonarQube Comment (Hide Old, Show Latest)
        uses: marocchino/sticky-pull-request-comment@v3
        if: always()
        with:
          header: sonarqube-results
          hide_and_recreate: true
          hide_classify: 'OUTDATED'
          message: ${{ steps.sonar.outputs.comment-body }}
