name: PR Commit Commenter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  scan-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Scan
        run: echo "Scan passed with no issues" > scan.txt

      - name: Post Scan Results
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <details>
            <summary>Scan results for commit ${{ github.sha }}</summary>
            ```
            ${{ steps.scan.outputs }}
            ```
            </details>