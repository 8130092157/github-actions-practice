name: PR Commit Commenter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-commit-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Commit Message
        id: get_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      # Step 1: Find existing commit comment (if any)
      - name: Find Commit Comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Hello world '

      # Step 2: Create or update the comment
      - name: Create or Update Commit Comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: |
            ### New Commit Detected!
            <details>
            <summary>Click to expand commit details</summary>

            * **Message:** `${{ steps.get_commit.outputs.msg }}`
            * **SHA:** `${{ github.sha }}`

            </details>

            *Automated feedback generated by GitHub Actions*
          edit-mode: replace
