name: PR Commit Commenter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  check-commit-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Commit Message
        id: get_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create or Update PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### New Commit Detected!
            <details>
            <summary>Click to expand commit details</summary>

            * **Message:** `${{ steps.get_commit.outputs.msg }}`
            * **SHA:** `${{ github.sha }}`

            </details>

            *Automated feedback generated by GitHub Actions*
