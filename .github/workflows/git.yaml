name: Print a greeting message

permissions:
  contents: read
  pull-requests: write

on: 
  pull_request:
    types: [opened, synchronize]

jobs:
  print-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: ./
        with:
        label: "needs review"
        gh-token: ${{ secrets.GITHUB_TOKEN }}

