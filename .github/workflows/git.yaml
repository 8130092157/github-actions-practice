name: git-cli

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: ca-dp/code-butler@v1
        with:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
#            OPEN_API_KEY: ${{secrets.OPENAI_API_KEY}}
#            cmd: chat
#            comment_body: ${{github.event.comment.body}}