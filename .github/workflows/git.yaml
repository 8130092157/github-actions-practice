name: Auto-label new PRs

permissions:
  contents: read
  pull-requests: write

on: 
  pull_request:
    types: [opened, synchronize]

jobs:
  print-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: 8130092157/github-actions-practice@v1.1.1
        with:
          label: "needs review"
          gh-token: ${{ secrets.GITHUB_TOKEN }}

